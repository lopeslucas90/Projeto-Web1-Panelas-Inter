<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Receita - panelinhas.com</title>
    <script src="script.js" defer></script>
</head>
<body> 
    <header class="cabecalho">
            <div id="caixa-busca">
                <input type="text" id="busca-texto" placeholder="pesquisar receita...">
                <img src="icones/icone-busca.png" id="botao-busca" alt="icone-busca">
            </div>
            <nav>
                <li class="logo-site"><img src="icones/logo_Panelas.png" alt="Logo Panelinhas" width="300" height="200"></li>
                <li><a href="home.html">Home</a></li>
            </nav>  
    </header>
    <hr id="listra_cabecalho">
    <main class="pag_receitas"> 
        <header class="cabecalho_receitas"> 
            <h2 id="receita-nome">Nome da receita</h2>
            <img id="receita-imagem" src="" alt="Foto da receita" width="200" height="250">
            <h3 id="receita-descricao">Descricao da receita</h3>
            
            <!-- Áudio e Vídeo separados no HTML (vêm ocultos por padrão) -->
            <audio id="receita-audio" controls style="display: none;" class="my-2">
                <source id="receita-audio-src" src="" type="audio/mpeg">
                Seu navegador não suporta áudio.
            </audio>

            <iframe id="receita-video" width="854" height="480" src="" title="Vídeo da Receita" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe>

            <div class="destaques">
                <img src="icones/icone_tempo.png" alt="Icone_tempo" width="15" height="15">
                <span id="receita-tempo">Tempo de Preparo:</span>
                <img src="icones/icone_rendimento.png" alt="Icone_Rendimento" width="15" height="15">
                <span id="receita-rendimento">Rendimento:</span>
                <img src="icones/icone_dificuldade.png" alt="Icone_Dificuldade" width="15" height="15">
                <span id="receita-dificuldade">Dificuldade:</span>
            </div>
            <hr>
        </header>
        <article>
            <p>Ingredientes:</p>
            <ul id="receita-ingredientes">
                <li>Ingrediente 1</li>
            </ul>
            <p>Modo de Preparo:</p>
            <ol id="receita-preparo">
                <li>Passo 1</li>
            </ol>
        </article>
        <div class="mt-4 mb-0 d-flex align-items-center justify-content-between flex-wrap gap-2" role="alert">
                    <a href="tabela.html" class="btn btn-sm text-white fw-semibold" style="background-color: #F79326;">Tabela de porcionamento</a>
        </div>
    </main>
    <footer>
        <p>Desenvolvido por...</p>
        <aside>
            <p>Siga as nosssas redes sociais</p>
            <nav>
                <a href=""><img src="icones/facebook-icone.png" alt="facebook" width="50"></a>
                <a href=""><img src="icones/instagram-icone.webp" alt="instagram-icone" width="50"></a>
            </nav>
        </aside>
    </footer>
</body>
</html>
