<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">    
    <link rel="stylesheet" href="style.css">
    <title>Seu Perfil - panelinhas.com</title>
</head>
<body>
    <header class="cabecalho">
        <div id="caixa-busca">
            <input type="text" id="busca-texto" placeholder="pesquisar receita...">
            <img src="icones/icone-busca.png" id="botao-busca" alt="icone-busca">
        </div>
        <nav>
            <li class="logo-site"><img src="icones/logo_Panelas.png" alt="Logo Panelinhas" width="300" height="200"></li>
            <li><a href="home.html">home</a></li>
        </nav>
    </header>
    <hr id="listra_cabecalho">
    <main class="cadastro">
        <a href="inserir_receita.html">
            <button type="button">Inserir receita!</button>
        </a>
        <br>
        <h2>Visualizar/alterar seu Perfil:</h2>
        <form id="form-perfil" action="" method="post">
            <fieldset> 

                <label>Foto de Perfil:</label><br>
                <img id="perfil-imagem" src="" alt="Foto de perfil" width="150" height="150"><br><br>

                <label for="foto_perfil_alterar">Alterar foto de perfil:</label>
                <input type="file" id="foto_perfil_alterar" name="foto_perfil_alterar" accept="image/*"><br><br>
                
                <label for="nome_alterar">Alterar Nome</label>
                <input type="text" id="nome_alterar" name="nome_alterar"><br>

                <label for="usuario_alterar">Alterar Usuário:</label>
                <input type="text" id="usuario_alterar" name="usuario_alterar"><br>

                <label for="data_nasc_alterar">Alterar data de Nascimento</label>
                <input type="date" id="data_nasc_alterar" name="data_nasc_alterar"><br>

                <label>Alterar Sexo:</label>
                <input type="radio" id="mas" name="sexo_alterar" value="mas">
                <label for="mas">Masculino</label>
                <input type="radio" id="fem" name="sexo_alterar" value="fem">
                <label for="fem">Feminino</label>
                <input type="radio" id="nin" name="sexo_alterar" value="nin">
                <label for="nin">Não informar</label><br>
                
                <label for="fone_alterar">Alterar Celular</label>
                <input type="tel" id="fone_alterar" name="fone_alterar" placeholder="99 99999-9999" pattern="[0-9]{2} [0-9]{5}-[0-9]{4}"><br>

                <label for="mail_alterar">Alterar E-mail</label>
                <input type="email" id="mail_alterar" name="mail_alterar"><br>

                <label for="senha_alterar">Mudar Senha:</label>
                <input type="password" id="senha_alterar" name="senha_alterar"><br>
        
                <label for="senhaConf_alterar">Confirme sua nova senha:</label>
                <input type="password" id="senhaConf_alterar" name="senhaConf_alterar"><br>   
                
                <input type="checkbox" id="notificacoes_alterar" name="notificacoes_alterar">
                <label for="notificacoes_alterar">Desejo receber notificações e recomendações de receitas</label><br><br>

                <input type="submit" value="Salvar alterações">
            </fieldset>
        </form>
    </main>
    <footer>
        <p>Desenvolvido por...</p>

        <aside>
            <p>Siga as nossas redes sociais</p>
            <nav>
                <a href=""><img src="icones/facebook-icone.png" alt="facebook" width="50"></a>
                <a href=""><img src="icones/instagram-icone.webp" alt="instagram-icone" width="50"></a>
            </nav>
        </aside>
    </footer>
    <script src="script.js"></script>
</body>
</html>
